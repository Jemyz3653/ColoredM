plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

group = 'io.github.jemyz3653.coloredm'
version = project.mod_version
base.archivesName = 'coloredm'

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    compileOnly "io.github.llamalad7:mixinextras-fabric:${project.mixinextras_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

jar {
    archiveVersion = "${project.mod_version}+${project.minecraft_version}"
    from('LICENSE') {
        rename { 'LICENSE_coloredm' }
    }
}
